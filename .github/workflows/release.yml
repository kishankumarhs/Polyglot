name: Build & Release Polyglot Logger

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.2.0)"
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  # Build native libraries for all platforms
  build-native:
    name: Build Native Library (${{ matrix.os }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        include:
          # Linux
          - os: linux
            runs-on: ubuntu-latest
            target: linux
            arch: x86_64
            goarch: amd64
            lib: liblogger.so
          # macOS Apple Silicon (Intel macOS-13 runners are often unavailable;
          # ship arm64 dylib; Rosetta Node still needs a native amd64 build later)
          # macOS Apple Silicon
          - os: macos-arm
            runs-on: macos-14
            target: darwin
            arch: arm64
            goarch: arm64
            lib: liblogger.dylib
          # Windows
          - os: windows
            runs-on: windows-latest
            target: windows
            arch: x86_64
            goarch: amd64
            lib: logger.dll
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Setup GCC (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Setup MinGW (Windows)
        if: matrix.os == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          path-type: inherit
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-make

      - name: Build native library (Windows)
        if: matrix.os == 'windows'
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE"
          ./scripts/build-native.sh dist/${{ matrix.os }}/${{ matrix.arch }}
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.target }}
          GOARCH: ${{ matrix.goarch }}
          CC: gcc

      - name: Build native library (Unix)
        if: matrix.os != 'windows'
        run: bash ./scripts/build-native.sh dist/${{ matrix.os }}/${{ matrix.arch }}
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.target }}
          GOARCH: ${{ matrix.goarch }}

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/${{ matrix.os }}/${{ matrix.arch }}/${{ matrix.lib }}
          if-no-files-found: error

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: checksums-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/${{ matrix.os }}/${{ matrix.arch }}/checksums.sha256
          if-no-files-found: error

  bench-release:
    name: Benchmark suite (release artifact)
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build native library
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gcc
          bash scripts/build-native.sh dist
      - name: Run benches
        env:
          POLYGLOT_LOGGER_LIB: ${{ github.workspace }}/dist/liblogger.so
          BENCH_NODE_N: "5000"
          BENCH_NODE_ITERS: "2"
          BENCH_OVERFLOW_N: "20000"
          BENCH_MEM_N: "20000"
        run: |
          set -euo pipefail
          mkdir -p bench/results
          cd bench/go
          go test -bench='BenchmarkPolyglotSyncFile|BenchmarkZapJSONFile|BenchmarkZerologFile' \
            -benchmem -count=3 -timeout 20m | tee ../results/go-release.txt
          go test -count=1 -run 'TestOverflow|TestHotReload|TestMemory' -timeout 10m | tee -a ../results/go-release.txt
          cd ../node
          npm install --silent
          node bench.mjs | tee ../results/node-release.txt
          node ffi_baseline.mjs | tee ../results/ffi-release.txt
          cd ../..
          cp bench/results/go-release.txt bench/results/go.txt
          cp bench/results/node-release.txt bench/results/node.txt
          cp bench/results/ffi-release.txt bench/results/ffi.txt
          python scripts/bench-summarize.py
          python scripts/bench-charts.py
          TAG="${GITHUB_REF_NAME:-dev}"
          {
            echo "| ${TAG} | see artifact | see artifact | see artifact | see artifact | ubuntu-latest release runner |"
          } >> bench/HISTORY.md
          cp bench/HISTORY.md bench/results/HISTORY.md
      - uses: actions/upload-artifact@v4
        with:
          name: bench-release
          path: bench/results/

  # Package for npm
  package-npm:
    name: Package for npm
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          registry-url: https://registry.npmjs.org/
          cache: npm
          cache-dependency-path: bindings/node/package-lock.json

      - name: Download all native artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Organize native binaries for npm
        run: bash scripts/package-native-libs.sh artifacts bindings/node

      - name: Install dependencies
        working-directory: bindings/node
        run: npm ci

      - name: Build TypeScript
        working-directory: bindings/node
        run: npm run build

      - name: Package npm tarball
        working-directory: bindings/node
        # prepack must not rebuild native (would wipe multi-arch bins)
        run: npm pack

      - name: Upload npm package
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: bindings/node/*.tgz

  # Package for PyPI
  package-python:
    name: Package for PyPI
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Download all native artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Organize native binaries for Python
        run: bash scripts/package-native-libs.sh artifacts bindings/python/polyglot_logger

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel build

      - name: Build Python wheel
        working-directory: bindings/python
        run: python -m build

      - name: Upload Python packages
        uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: bindings/python/dist/

  # Package for .NET/NuGet
  package-dotnet:
    name: Package for NuGet
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0"

      - name: Download all native artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Organize native binaries for .NET
        run: bash scripts/package-native-libs.sh artifacts bindings/dotnet/Polyglot.Logger

      - name: Build NuGet package
        working-directory: bindings/dotnet/Polyglot.Logger
        run: dotnet pack -c Release -o ../dist/

      - name: Upload .NET packages
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-packages
          path: bindings/dotnet/dist/
          if-no-files-found: error

  # Create GitHub Release with all artifacts
  create-release:
    name: Create GitHub Release
    needs: [package-npm, package-python, package-dotnet, bench-release]
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/')
      || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/

      - name: Resolve release tag
        id: release_tag
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            release-artifacts/npm-package/*.tgz
            release-artifacts/python-packages/*
            release-artifacts/dotnet-packages/*.nupkg
            release-artifacts/bench-release/**
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish to npm
  publish-npm:
    name: Publish to npm
    needs: [package-npm, create-release]
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/')
      || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download npm package
        uses: actions/download-artifact@v4
        with:
          name: npm-package

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          registry-url: https://registry.npmjs.org/

      - name: Publish to npm
        run: npm publish *.tgz --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Publish to PyPI
  publish-pypi:
    name: Publish to PyPI
    needs: [package-python, create-release]
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/')
      || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download Python packages
        uses: actions/download-artifact@v4
        with:
          name: python-packages
          path: dist/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install twine
        run: pip install twine

      - name: Publish to PyPI
        run: twine upload --skip-existing dist/* --non-interactive
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  # Publish to NuGet
  publish-nuget:
    name: Publish to NuGet
    needs: [package-dotnet, create-release]
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/')
      || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download .NET packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0"

      - name: Publish to NuGet
        run: |
          set -euo pipefail
          mapfile -t packages < <(find artifacts -type f -name "*.nupkg" ! -name "*.snupkg")
          if [[ ${#packages[@]} -eq 0 ]]; then
            echo "No .nupkg files found in downloaded artifacts" >&2
            exit 1
          fi

          for file in "${packages[@]}"; do
            dotnet nuget push "$file" -k ${{ secrets.NUGET_TOKEN }} -s https://api.nuget.org/v3/index.json --skip-duplicate
          done
