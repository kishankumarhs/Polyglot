name: Build

on:
  push:
  pull_request:

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y gcc
      - name: Check doc version pins
        run: bash scripts/check-doc-versions.sh
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal native)" || (gofmt -l cmd internal native && echo "run gofmt -w" && exit 1)
      - name: Vet
        run: go vet ./cmd/... ./internal/... ./native/...
      - name: Test Go core and native layer
        run: go test ./cmd/... ./internal/... ./native/... -race -count=1
      - name: Codegen drift check (core only)
        run: |
          go run ./cmd/codegen
          git diff --exit-code -- native/include/logger.h || (echo "codegen drift in core: run go run ./cmd/codegen and commit" && exit 1)
      - name: Note on binding codegen
        run: echo "Binding FFI files are in independent submodules. Run codegen in each binding repo to update."

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: liblogger.so
          - os: windows-latest
            artifact: logger.dll
          - os: macos-latest
            artifact: liblogger.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc
      - name: Build native library (Unix)
        if: runner.os != 'Windows'
        run: bash scripts/build-native.sh dist
      - name: Build native library (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: bash scripts/build-native.sh dist
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: |
            dist/${{ matrix.artifact }}
            dist/logger.h
            dist/checksums.sha256

  python-smoke:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build native library
        run: |
          sudo apt-get update && sudo apt-get install -y gcc
          bash scripts/build-native.sh dist
      - name: Install and test
        env:
          POLYGLOT_CONFIG: ${{ github.workspace }}/.github/ci-safe.yaml
        run: |
          python -m pip install pytest
          python -m pip install -e bindings/python
          pytest bindings/python/tests -q

  node-smoke:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build native library
        run: |
          sudo apt-get update && sudo apt-get install -y gcc
          bash scripts/build-native.sh dist
      - name: Install, build, test
        working-directory: bindings/node
        env:
          POLYGLOT_LOGGER_LIB: ${{ github.workspace }}/dist/liblogger.so
          POLYGLOT_CONFIG: ${{ github.workspace }}/.github/ci-safe.yaml
        run: |
          npm install
          npm run build
          npm test

  dotnet-smoke:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build native library
        run: |
          sudo apt-get update && sudo apt-get install -y gcc
          bash scripts/build-native.sh dist
      - name: Test
        env:
          POLYGLOT_LOGGER_LIB: ${{ github.workspace }}/dist/liblogger.so
          POLYGLOT_CONFIG: ${{ github.workspace }}/.github/ci-safe.yaml
        run: dotnet test bindings/dotnet/Polyglot.Logger.Tests/Polyglot.Logger.Tests.csproj -c Release

  bench-smoke:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build native library
        run: |
          sudo apt-get update && sudo apt-get install -y gcc
          bash scripts/build-native.sh dist
      - name: Bench smoke
        env:
          POLYGLOT_LOGGER_LIB: ${{ github.workspace }}/dist/liblogger.so
          POLYGLOT_CONFIG: ${{ github.workspace }}/.github/ci-safe.yaml
        run: bash scripts/bench-smoke.sh
      - name: Upload bench artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-smoke
          path: bench/results/
          if-no-files-found: ignore
