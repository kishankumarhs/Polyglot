# Polyglot Logger Project-Wide Configuration
# Place in project root for zero-config discovery by language bindings.

service: polyglot-app
service_version: "1.0.0"
environment: dev
level: info

stdout: true
stdout_format: json
caller: false
strict: false

file:
  enabled: false
  path: ./logs/app.log
  max_size_mb: 100
  max_backups: 10
  max_age_days: 30
  compress: true

http:
  enabled: false
  url: https://collector.example/v1/logs
  timeout_ms: 5000
  batch_size: 50
  flush_interval_ms: 1000

loki:
  enabled: false
  url: http://loki:3100/loki/api/v1/push
  timeout_ms: 5000
  batch_size: 50
  flush_interval_ms: 1000
  labels:
    job: polyglot-app

async: true
queue_size: 10000
overflow: drop_newest

sampling:
  enabled: false
  initial: 100
  thereafter: 100

fields:
  region: us-east-1
  cluster: prod
