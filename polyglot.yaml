# Polyglot Logger Project-Wide Configuration
# Place in project root for zero-config discovery by language bindings.

service: polyglot-app
service_version: "1.0.0"
environment: prod
level: info
stdout: true
stdout_format: json
caller: false
strict: false

file:
  enabled: true
  path: ./logs/app.log
  maxSizeMB: 100
  maxBackups: 10
  maxAgeDays: 30
  compress: true
  fsync: false

http:
  enabled: true
  url: https://collector.example/v1/logs
  timeout_ms: 5000
  headers:
    Authorization: "Bearer <token>"
  batch_size: 50
  flush_interval_ms: 1000

loki:
  enabled: false
  url: http://loki:3100/loki/api/v1/push
  batch_size: 50
  flush_interval_ms: 1000
  labels:
    job: workflow-service

otlp:
  enabled: false
  url: https://collector.example/v1/logs
  timeout_ms: 5000
  batch_size: 50
  flush_interval_ms: 1000
  headers:
    Authorization: "Bearer <token>"

kafka:
  enabled: false
  brokers:
    - kafka-1:9092
    - kafka-2:9092
  topic: app-logs
  timeout_ms: 5000
  batch_size: 50
  flush_interval_ms: 1000
  required_acks: 1

async: true
queueSize: 10000
overflow: drop_newest

sampling:
  enabled: false
  initial: 100
  thereafter: 100

fields:
  region: ap-south-1
