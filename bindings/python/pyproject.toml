[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polyglot-logger"
version = "0.2.0"
description = "Python bindings for the Polyglot native structured logger"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Polyglot" }]
keywords = ["logging", "structured", "logger", "native", "performance"]

[tool.setuptools.packages.find]
where = ["."]
include = ["polyglot_logger*"]

[tool.setuptools.package-data]
polyglot_logger = ["native/*", "bin/*"]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
